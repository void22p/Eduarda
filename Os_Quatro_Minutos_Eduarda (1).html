<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Os Quatro Minutos — Livro de Eduarda</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#795239,#2c1b13 70%);color:#f0dfc2;font:18px Georgia,serif;min-height:100vh}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #b98236;outline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 4vw;border-bottom:1px solid #ffffff25}header span,small,.eyebrow{font:11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}header button,nav button{background:#352219;color:#f4dfba;border:1px solid #9b7950;padding:10px 15px;border-radius:4px}main{max-width:1200px;margin:auto;padding:30px 24px}nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0} .cover{position:relative;max-width:470px;min-height:620px;margin:10px auto;padding:65px 40px;text-align:center;background:repeating-linear-gradient(103deg,#ffffff03 0 1px,transparent 1px 4px),radial-gradient(ellipse,#855737,#452719 75%);border:8px solid #4b2b1c;border-radius:5px 15px 15px 5px;box-shadow:inset 12px 0 20px #1d100b88,8px 8px 0 #bba582,12px 12px 0 #4b2b1c,0 30px 70px #0009;color:#e9c98b;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;animation:open .8s ease both}.cover:before,.cover:after{content:'';position:absolute;inset:20px;border:1px solid #c59b60;pointer-events:none}.cover:after{inset:27px;border:3px double #c59b60}.cover h1{font-size:clamp(48px,8vw,76px);line-height:.95;font-weight:normal;margin:0}.cover p{line-height:1.6;max-width:320px}.coin{display:grid;place-items:center;width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#e8c78c,#9d6935);border:7px double #f1d39b;color:#55351c;font-size:54px;box-shadow:0 5px 12px #0008}.primary{background:#684329;color:#fff1d5;border:1px solid #a97b48;padding:14px 22px;border-radius:3px}.cover .primary{background:#d7b47a;color:#382217;z-index:1}.spread{display:grid;grid-template-columns:1fr 1fr;perspective:1800px;border:9px solid #4c2b1b;border-radius:9px;box-shadow:0 20px 60px #0008,0 5px 0 #bfa783;align-items:stretch}.page{position:relative;min-width:0;min-height:610px;padding:38px 42px 55px;color:#422d20;background:radial-gradient(ellipse at 50% 30%,#fff4dc,#e8d4ad);line-height:1.65;overflow-wrap:anywhere}.left{background:linear-gradient(90deg,transparent 92%,#8c694b55),radial-gradient(ellipse,#fff4dc,#e8d4ad)}.right{background:linear-gradient(90deg,#8c694b55,transparent 8%),radial-gradient(ellipse,#fff4dc,#e8d4ad);transform-origin:left;animation:turn .65s ease-out both}.page h1{font-size:clamp(32px,4vw,49px);line-height:1.08;font-weight:normal;margin:22px 0}.page h2{font-size:25px;font-weight:normal}.page small{color:#846143}.page p{white-space:pre-line}.folio{position:absolute;bottom:17px;left:0;right:0;text-align:center;color:#8b694a;font-size:13px}.photo{height:155px;border:1px solid #9c7953;background:linear-gradient(135deg,#b7986b,#e7d4ad);overflow:hidden;margin:18px 0}.photo img{width:100%;height:100%;object-fit:cover;filter:sepia(.75)}.choice{display:flex;text-align:left;gap:13px;width:100%;padding:13px;margin:10px 0;background:#fff7e455;color:#4b3020;border:1px solid #b79a72;border-radius:3px;line-height:1.4}.choice:hover{background:#d8bd90}.choice b{color:#966d43}.note{width:100%;min-height:90px;background:transparent;border:1px solid #b69b76;padding:10px;color:#4b3020;resize:vertical}.entry{border-bottom:1px solid #c7ae87;padding:10px 0;font-size:15px}.entry small{display:block}.blank{display:grid;place-content:center;text-align:center;min-height:460px;color:#967e60}.rule{border:0;border-top:1px solid #bfa17a;margin:25px 0}.ornament{text-align:center;color:#a27b48;letter-spacing:12px}.ink{animation:ink .9s ease both}@keyframes ink{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:blur(0)}}@keyframes turn{from{transform:rotateY(-32deg);opacity:.55}to{transform:rotateY(0);opacity:1}}@keyframes open{from{transform:rotateY(-20deg);opacity:.4}to{transform:none;opacity:1}}@media(max-width:700px){header{flex-wrap:wrap}main{padding:15px 10px}.spread{display:block;border-width:5px}.page{padding:25px 22px 48px;min-height:0}.left{border-bottom:1px solid #b99b72}.right{min-height:330px}.cover{min-height:530px;padding:48px 28px}.photo{height:130px}.page h1{font-size:36px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><header><span>Os quatro minutos · edição Eduarda</span><div><button id="sound" onclick="toggleSound()">Som: desligado</button> <button onclick="reset()">Recomeçar</button></div></header><main id="app"></main><script>
const nodes={"start": {"day": 1, "time": "06:56", "place": "rua", "title": "A moeda", "body": "A quatro minutos do fechamento do portão, Eduarda vê uma moeda de um real perto da banca de jornais. Uma senhora de bolsa verde examina o chão. A escola fica a três minutos dali. Na mochila, um conto ainda incompleto para a mostra literária de sexta-feira. O celular vibra: Clara pergunta se ela já chegou.", "choices": [{"label": "Perguntar à senhora se perdeu a moeda", "to": "woman", "set": {"coin": "devolvida"}}, {"label": "Pegar a moeda e continuar", "to": "pick", "set": {"coin": "guardada"}}, {"label": "Não parar; responder Clara depois", "to": "gate", "set": {"coin": "ignorada"}}, {"label": "Fotografar a moeda para usar no conto", "to": "photo", "set": {"coin": "fotografada"}}]}, "woman": {"day": 1, "time": "06:58", "place": "rua", "title": "Dona Lúcia", "body": "A moeda era de Lúcia, que precisava completar a passagem. Ela agradece e pergunta o nome da estudante. Ao ouvir Eduarda, comenta que trabalha na biblioteca municipal e que hoje haverá uma caixa de livros doados. O ônibus chega. Restam dois minutos.", "choices": [{"label": "Despedir-se e seguir para a escola", "to": "late", "set": {"lucia": true}}, {"label": "Anotar o horário da biblioteca antes de sair", "to": "late", "set": {"lucia": true, "invite": true}}]}, "pick": {"day": 1, "time": "06:57", "place": "rua", "title": "Um real no bolso", "body": "Ao guardar a moeda, Eduarda percebe que o cadarço se soltou. Parar para amarrá-lo custa mais alguns segundos. A senhora ainda procura algo. Ela pode voltar ou seguir.", "choices": [{"label": "Voltar e perguntar sobre a moeda", "to": "woman", "set": {"coin": "devolvida"}}, {"label": "Amarrar o cadarço e seguir", "to": "edge", "set": {}}, {"label": "Deixar a moeda sobre a banca para quem perdeu", "to": "edge", "set": {"coin": "deixada"}}]}, "photo": {"day": 1, "time": "06:58", "place": "rua", "title": "Uma imagem", "body": "A fotografia captura também a senhora ao fundo. Eduarda pensa em uma abertura para seu conto: um objeto banal que muda uma manhã. O sinal da escola soa ao longe.", "choices": [{"label": "Guardar o celular e seguir", "to": "late", "set": {}}, {"label": "Apagar a foto por respeito à privacidade e seguir", "to": "late", "set": {"coin": "ignorada"}}]}, "edge": {"day": 1, "time": "07:00", "place": "escola", "title": "O último segundo", "body": "O inspetor Sérgio está fechando o portão. Clara acena do pátio. Ele ainda consegue ouvir Eduarda.", "choices": [{"label": "Pedir que espere e mostrar a carteirinha", "to": "gate", "set": {}}, {"label": "Aceitar o fechamento sem discutir", "to": "late", "set": {}}]}, "gate": {"day": 1, "time": "07:00", "place": "escola", "title": "Dentro do portão", "body": "Eduarda chega a tempo. Clara guardou um lugar na sala. A professora Helena anuncia que a mostra de sexta terá leitura pública e inscrições até quarta. Miguel, 16 anos, aluno de outra turma, está ajudando a organizar os textos.", "choices": [{"label": "Inscrever-se para ler o próprio conto", "to": "class", "set": {"read": true}}, {"label": "Oferecer ajuda na organização", "to": "class", "set": {"organize": true}}, {"label": "Preferir assistir à mostra", "to": "class", "set": {}}]}, "late": {"day": 1, "time": "07:02", "place": "escola", "title": "Do lado de fora", "body": "Sérgio explica que a entrada atrasada só será autorizada às 07:20 pela coordenação. A primeira atividade já começou. Eduarda tem vinte minutos e precisa avisar a escola e sua responsável.", "choices": [{"label": "Explicar o ocorrido com sinceridade", "to": "wait", "set": {"honest": true}}, {"label": "Apenas informar que chegou atrasada", "to": "wait", "set": {}}, {"label": "Pedir à coordenação autorização para recuperar a atividade", "to": "wait", "set": {"recover": true}}]}, "wait": {"day": 1, "time": "07:10", "place": "escola", "title": "O banco da entrada", "body": "Enquanto aguarda na recepção, Eduarda recebe uma mensagem de Clara: a turma precisa escolher uma dupla para a mostra. Miguel também está na recepção, entregando cartazes à secretaria. Ele deixa cair uma folha com um poema autoral.", "choices": [{"label": "Entregar a folha sem ler", "to": "miguel", "set": {"miguel": true}}, {"label": "Avisar que a folha caiu e continuar esperando", "to": "class", "set": {"miguel": true}}, {"label": "Responder Clara e perguntar sobre a dupla", "to": "class", "set": {"clara": true}}]}, "miguel": {"day": 1, "time": "07:15", "place": "escola", "title": "O poema dobrado", "body": "Miguel agradece. Diz que escreve, mas não sabe se quer ler em público. Eduarda reconhece no título uma referência à ideia de acaso. A coordenadora chama seu nome.", "choices": [{"label": "Sugerir conversar sobre literatura no intervalo", "to": "class", "set": {"talk": true}}, {"label": "Desejar boa sorte e entrar na sala", "to": "class", "set": {}}]}, "class": {"day": 1, "time": "09:40", "place": "escola", "title": "O intervalo", "body": "A atividade da manhã era uma interpretação de conto. Clara está preocupada com a nota e quer revisar as respostas. Na mesa ao lado, Miguel organiza os cartazes da mostra. O intervalo dura quinze minutos.", "choices": [{"label": "Revisar a atividade com Clara", "to": "lunch", "set": {"clara": true}}, {"label": "Conversar com Miguel sobre o tema da mostra", "to": "lunch", "set": {"miguel": true, "talk": true}}, {"label": "Dividir o intervalo entre os dois", "to": "lunch", "set": {"clara": true, "miguel": true}}, {"label": "Escrever sozinha no caderno", "to": "lunch", "set": {"draft": true}}]}, "lunch": {"day": 1, "time": "12:10", "place": "escola", "title": "Depois da aula", "body": "A professora Helena lembra que o conto precisa ter até três páginas. Clara sugere estudar juntas amanhã. O cartaz da biblioteca municipal anuncia uma roda de leitura às 15h. Eduarda precisa combinar a tarde com sua responsável.", "choices": [{"label": "Ir à biblioteca com autorização", "to": "library", "set": {"library": true}}, {"label": "Voltar para casa e trabalhar no conto", "to": "home", "set": {"draft": true}}, {"label": "Combinar estudo com Clara e voltar para casa", "to": "home", "set": {"clara": true, "study": true}}]}, "library": {"day": 1, "time": "15:00", "place": "biblioteca", "title": "A caixa de doações", "body": "Lúcia organiza livros usados. Entre eles há um caderno sem nome, com uma frase manuscrita: “O que muda quando chegamos quatro minutos depois?” A bibliotecária explica que o caderno foi encontrado entre doações e pode ter dono.", "choices": [{"label": "Deixar o caderno com Lúcia para localizar o dono", "to": "reading", "set": {"notebook": "deixado"}}, {"label": "Pedir autorização para copiar apenas a frase", "to": "reading", "set": {"notebook": "frase", "draft": true}}, {"label": "Ajudar Lúcia a organizar os livros", "to": "reading", "set": {"notebook": "deixado", "help": true}}]}, "reading": {"day": 1, "time": "15:35", "place": "biblioteca", "title": "A roda de leitura", "body": "Miguel aparece com um livro emprestado. O grupo discute se uma boa intenção garante uma boa consequência. Lúcia convida os jovens a apresentar textos na sexta, junto à escola.", "choices": [{"label": "Compartilhar a ideia da moeda, sem inventar o que não sabe", "to": "home", "set": {"miguel": true, "talk": true, "draft": true}}, {"label": "Ouvir e anotar argumentos para o conto", "to": "home", "set": {"draft": true}}, {"label": "Conversar com Lúcia sobre a parceria com a escola", "to": "home", "set": {"help": true, "organize": true}}]}, "home": {"day": 1, "time": "19:30", "place": "casa", "title": "A primeira página", "body": "À noite, Eduarda abre o caderno. A manhã parece pequena demais para uma história, mas cada detalhe permite imaginar um caminho diferente. Clara envia uma mensagem perguntando se está tudo bem. O prazo da mostra se aproxima.", "choices": [{"label": "Escrever sobre a moeda e suas consequências", "to": "tue", "set": {"theme": "acaso", "draft": true}}, {"label": "Escrever sobre uma amizade que muda por um atraso", "to": "tue", "set": {"theme": "amizade", "draft": true}}, {"label": "Escrever sobre dois jovens que se conhecem por acaso", "to": "tue", "set": {"theme": "encontro", "draft": true}}, {"label": "Responder Clara e descansar antes de escrever", "to": "tue", "set": {"theme": "cotidiano", "clara": true}}]}, "tue": {"day": 2, "time": "07:05", "place": "escola", "title": "O trabalho em dupla", "body": "Helena pede uma análise em dupla. Clara esperava trabalhar com Eduarda, mas Miguel está sem parceiro porque seu colega faltou. Há uma terceira opção: solicitar um trio, embora a professora possa precisar reorganizar a atividade.", "choices": [{"label": "Fazer dupla com Clara", "to": "pair", "set": {"partner": "Clara", "clara": true}}, {"label": "Convidar Miguel, explicando a Clara antes", "to": "pair", "set": {"partner": "Miguel", "miguel": true}}, {"label": "Pedir autorização para formar trio", "to": "pair", "set": {"partner": "trio", "clara": true, "miguel": true}}]}, "pair": {"day": 2, "time": "10:15", "place": "escola", "title": "A margem do texto", "body": "A análise termina. Helena sugere que Eduarda leve uma versão do conto amanhã. Clara comenta que também quer escrever, mas tem receio de mostrar seu texto. Miguel oferece uma opinião se Eduarda quiser.", "choices": [{"label": "Trocar textos com Clara", "to": "feedback", "set": {"review": "Clara", "clara": true}}, {"label": "Pedir opinião a Miguel", "to": "feedback", "set": {"review": "Miguel", "miguel": true}}, {"label": "Revisar sozinha antes de mostrar a alguém", "to": "feedback", "set": {"review": "própria"}}]}, "feedback": {"day": 2, "time": "16:20", "place": "casa", "title": "Uma crítica útil", "body": "Ao reler o conto, Eduarda percebe que a personagem parece conhecer as consequências antes de decidir. Isso enfraquece a ideia: ninguém sabia o que aconteceria quando viu a moeda.", "choices": [{"label": "Reescrever a cena sem antecipar o futuro", "to": "wed", "set": {"revision": "incerteza"}}, {"label": "Manter a antecipação como recurso literário explícito", "to": "wed", "set": {"revision": "narrador"}}, {"label": "Criar dois pontos de vista sobre o mesmo instante", "to": "wed", "set": {"revision": "perspectivas"}}]}, "wed": {"day": 3, "time": "08:20", "place": "escola", "title": "O prazo", "body": "As inscrições terminam ao meio-dia. Helena oferece três formatos: leitura individual, exposição escrita ou colaboração com outro aluno, desde que os créditos sejam claros. Eduarda precisa decidir como apresentar seu trabalho.", "choices": [{"label": "Inscrever leitura individual", "to": "submit", "set": {"format": "leitura"}}, {"label": "Inscrever exposição escrita", "to": "submit", "set": {"format": "exposição"}}, {"label": "Propor colaboração e combinar créditos", "to": "collab", "set": {"format": "colaboração"}}, {"label": "Não inscrever o conto; ajudar na mostra", "to": "organize", "set": {"format": "bastidores"}}]}, "collab": {"day": 3, "time": "09:10", "place": "escola", "title": "Dois nomes", "body": "Uma colaboração precisa de consentimento e trabalho real de ambas as partes. Clara prefere escrever um segundo ponto de vista. Miguel prefere comentar a estrutura sem assinar como autor.", "choices": [{"label": "Convidar Clara para coautoria", "to": "submit", "set": {"author": "Clara", "clara": true}}, {"label": "Manter autoria individual e agradecer Miguel pela revisão", "to": "submit", "set": {"author": "individual", "format": "exposição", "miguel": true}}, {"label": "Manter autoria individual e escrever as duas perspectivas", "to": "submit", "set": {"author": "individual", "format": "leitura"}}]}, "submit": {"day": 3, "time": "11:45", "place": "escola", "title": "O envelope", "body": "O texto está pronto para entrega. Há uma frase inspirada na manhã da moeda. Eduarda precisa decidir se o título revelará a consequência ou preservará a surpresa.", "choices": [{"label": "Intitular “Os quatro minutos”", "to": "thu", "set": {"title": "Os quatro minutos", "submitted": true}}, {"label": "Intitular “Um real”", "to": "thu", "set": {"title": "Um real", "submitted": true}}, {"label": "Intitular “O que não aconteceu”", "to": "thu", "set": {"title": "O que não aconteceu", "submitted": true}}]}, "organize": {"day": 3, "time": "11:45", "place": "escola", "title": "Outra contribuição", "body": "Helena aceita a ajuda. Eduarda pode preparar os cartões de apresentação ou organizar a ordem das leituras. O conto continua em seu caderno, mesmo sem inscrição.", "choices": [{"label": "Preparar cartões para os autores", "to": "thu", "set": {"role": "cartões"}}, {"label": "Organizar a ordem das leituras", "to": "thu", "set": {"role": "ordem"}}]}, "thu": {"day": 4, "time": "12:15", "place": "escola", "title": "Uma mudança de planos", "body": "A chuva prevista para sexta obriga a escola a transferir a mostra do pátio para a biblioteca. Há menos espaço. Helena pede ajuda para reorganizar as cadeiras. Clara quer conversar sobre seu texto; Miguel pergunta se Eduarda gostaria de trocar recomendações de livros depois da mostra.", "choices": [{"label": "Ajudar Helena e combinar outro horário com Clara", "to": "rain", "set": {"help": true, "clara": true}}, {"label": "Conversar com Clara primeiro e depois ajudar", "to": "rain", "set": {"clara": true, "help": true}}, {"label": "Aceitar a troca de recomendações e ajudar na mudança", "to": "rain", "set": {"miguel": true, "books": true, "help": true}}, {"label": "Avisar que precisa voltar para casa", "to": "rain", "set": {}}]}, "rain": {"day": 4, "time": "18:00", "place": "casa", "title": "A mensagem", "body": "A mostra começa amanhã às 14h. O celular recebe uma mensagem de Miguel perguntando se pode reservar um livro para Eduarda na biblioteca. Não há obrigação de aceitar, e o gesto pode significar apenas amizade.", "choices": [{"label": "Aceitar e sugerir conversar sobre o livro na mostra", "to": "fri", "set": {"books": true, "miguel": true}}, {"label": "Agradecer e dizer que prefere escolher pessoalmente", "to": "fri", "set": {"books": false}}, {"label": "Responder que prefere manter a conversa sobre a escola", "to": "fri", "set": {"boundary": true}}]}, "fri": {"day": 5, "time": "13:50", "place": "biblioteca", "title": "Dez minutos antes", "body": "A biblioteca está cheia. Helena confere a programação. Clara segura seu texto com as mãos inquietas. Miguel organiza os livros na mesa. Lúcia chega com uma caixa de doações. A mostra está prestes a começar.", "choices": [{"label": "Perguntar se Clara quer companhia antes de apresentar", "to": "show", "set": {"support": true, "clara": true}}, {"label": "Conferir a programação com Helena", "to": "show", "set": {"help": true}}, {"label": "Ajudar Lúcia com a caixa", "to": "show", "set": {"help": true, "lucia": true}}, {"label": "Sentar e observar o ambiente", "to": "show", "set": {}}]}, "show": {"day": 5, "time": "14:20", "place": "biblioteca", "title": "O momento público", "body": "Uma leitura termina e a sala aplaude. Helena se aproxima de Eduarda. O formato escolhido na quarta define o que acontece agora.", "choices": [{"label": "Participar conforme o compromisso assumido", "to": "after", "set": {"fulfilled": true}}, {"label": "Pedir uma adaptação do formato por nervosismo", "to": "after", "set": {"adapted": true}}, {"label": "Explicar que prefere não se apresentar e acompanhar os colegas", "to": "after", "set": {"withdraw": true}}]}, "after": {"day": 5, "time": "15:10", "place": "biblioteca", "title": "Depois dos aplausos", "body": "A mostra termina. Clara agradece a presença dos colegas. Miguel comenta que gostou da discussão sobre escolhas e pergunta se Eduarda quer continuar trocando textos. Lúcia anuncia que a biblioteca terá encontros mensais de leitura.", "choices": [{"label": "Combinar uma amizade literária com Miguel", "to": "sat", "set": {"relation": "amizade", "miguel": true}}, {"label": "Demonstrar interesse em conhecê-lo melhor, sem pressa", "to": "sat", "set": {"relation": "aproximação", "miguel": true}}, {"label": "Convidar Clara para os encontros mensais", "to": "sat", "set": {"relation": "grupo", "clara": true}}, {"label": "Preferir escrever por conta própria", "to": "sat", "set": {"relation": "individual"}}]}, "sat": {"day": 6, "time": "09:30", "place": "rua", "title": "A mesma calçada", "body": "No sábado, Eduarda passa novamente pela banca. O lugar parece idêntico. Nenhuma moeda brilha no chão. Ela tem tempo para observar o movimento da rua e pensar na semana.", "choices": [{"label": "Registrar no diário o que de fato aconteceu", "to": "end", "set": {"reflection": "fatos"}}, {"label": "Imaginar uma alternativa sem tratá-la como certeza", "to": "end", "set": {"reflection": "alternativas"}}, {"label": "Escrever uma carta para a Eduarda de segunda-feira", "to": "end", "set": {"reflection": "carta"}}]}};const photos={rua:'photo-1519608487953-e999c86e7455',escola:'photo-1509062522246-3755977927d7',biblioteca:'photo-1507842217343-583bb7270b66',casa:'photo-1455390582262-044cdead277a'};const days=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];const app=document.getElementById('app');let state={id:'cover',flags:{},log:[],notes:{}};let history=[];try{const saved=JSON.parse(localStorage.getItem('quatro-minutos-livro-v1'));if(saved){state=saved.state;history=saved.history}}catch(e){};function save(){try{localStorage.setItem('quatro-minutos-livro-v1',JSON.stringify({state,history}))}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(id,flags={},label=''){history.push(JSON.parse(JSON.stringify(state)));if(label){let x=nodes[state.id];state.log.push({day:x.day,time:x.time,title:x.title,label})}Object.assign(state.flags,flags);state.id=id;save();render();window.scrollTo(0,0)}function back(){if(history.length){state=history.pop();save();render();window.scrollTo(0,0)}}function reset(){if(confirm('Recomeçar a história? O percurso atual será apagado.')){state={id:'cover',flags:{},log:[],notes:{}};history=[];save();render()}}function note(v){state.notes[state.id]=v;save()}function context(id){let f=state.flags;let a=[];if(id==='class'&&state.log.some(x=>x.title==='Do lado de fora'))a.push(f.recover?'A coordenação combinou a recuperação da atividade.':'Eduarda perdeu a primeira atividade e precisará pedir o conteúdo.');if(id==='library'&&f.lucia)a.push('Lúcia reconhece Eduarda da manhã e agradece novamente.');if(id==='library'&&!f.lucia)a.push('Lúcia se apresenta; é a primeira conversa entre as duas.');if(id==='tue'&&f.study)a.push('Clara lembra do estudo combinado ontem e reserva um horário depois da aula.');if(id==='feedback')a.push(f.review==='própria'?'A observação surgiu durante a revisão individual.':f.review+' apontou essa questão durante a troca de textos.');if(id==='wed'&&f.draft)a.push('As anotações feitas nos dias anteriores facilitaram a preparação da versão final.');if(id==='show')a.push(f.format==='bastidores'?'Eduarda está na equipe de organização, não na lista de autores.':f.format==='exposição'?'O conto está exposto na mesa, sem obrigação de leitura oral.':f.author==='Clara'?'Clara está pronta para dividir a apresentação e os créditos.':'O nome de Eduarda aparece na programação de leitura.');if(id==='after'&&f.boundary)a.push('Miguel respeitou o limite estabelecido na mensagem e mantém a conversa sobre literatura.');if(id==='after'&&f.books)a.push('O livro reservado está na mesa; Miguel mostra onde encontrá-lo.');if(id==='after'&&f.support)a.push('Clara conta que a companhia antes da leitura a ajudou a se sentir mais tranquila.');return a.join(' ')}function options(id){let x=nodes[id].choices;if(id==='show'&&state.flags.format==='bastidores')return [{label:'Cumprir a tarefa de organização combinada',to:'after',set:{fulfilled:true}},{label:'Pedir ajuda à equipe e acompanhar a mostra',to:'after',set:{adapted:true}}];if(id==='after'&&state.flags.boundary)return x.filter(c=>c.set.relation!=='aproximação');return x}function choose(i){let c=options(state.id)[i];go(c.to,c.set,c.label)}function logHTML(){return state.log.map(x=>`<div class="entry"><small>${days[x.day-1]} · ${x.time}</small>${esc(x.title)}<br><b>${esc(x.label)}</b></div>`).join('')}let preview=false;let sound=false;let audio;function rustle(){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let b=audio.createBuffer(1,Math.floor(audio.sampleRate*.22),audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length)*.07;let src=audio.createBufferSource(),filter=audio.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1300;src.buffer=b;src.connect(filter);filter.connect(audio.destination);src.start()}catch(e){}}function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'Som: ligado':'Som: desligado';rustle()}function page(a,b,n){return `<div class="spread"><article class="page left"><div class="ink">${a}</div><div class="folio">${n}</div></article><article class="page right"><div class="ink">${b}</div><div class="folio">${n+1}</div></article></div>`}function turn(id){preview=false;rustle();go(id)}function pick(i){preview=false;rustle();choose(i)}function previous(){preview=false;rustle();back()}function future(){preview=!preview;rustle();render()}function render(){let f=state.flags,n=state.log.length*2+5;let nav=`<nav><button onclick="previous()">← Página anterior</button><button onclick="future()">${preview?'Voltar à história':'Folhear adiante →'}</button></nav>`;if(preview){app.innerHTML=page('<div class="blank">O futuro ainda não foi escrito.</div>','<div class="blank">Esta página aguarda uma escolha.<br><button class="primary" onclick="future()">Retornar</button></div>',n+2);return}if(state.id==='cover'){app.innerHTML=`<section class="cover"><small>Uma novela de possibilidades</small><div class="coin">1</div><h1>Os quatro<br><i>minutos</i></h1><div class="ornament">✦ ❦ ✦</div><p>Edição especial para Eduarda</p><button class="primary" onclick="turn('prelude')">Abrir o livro →</button><small>2026 · Ficção interativa</small></section>`;return}if(state.id==='prelude'){app.innerHTML=page('<small>Folha de rosto</small><h1>Os quatro minutos</h1><div class="ornament">❦</div><p>Para Eduarda, que encontra na literatura e na filosofia maneiras de interrogar o cotidiano.</p><p>Uma moeda. Uma manhã. Uma semana que ainda não existe.</p>','<small>Prelúdio</small><h1>Antes da escolha</h1><p>Eduarda tem 16 anos, estuda no ensino médio e gosta de literatura e filosofia. Na sexta-feira haverá uma mostra literária na escola. Ela tem um conto por terminar e uma amiga chamada Clara.</p><p>É segunda-feira. O portão fecha às sete. Na calçada, uma moeda de um real aguarda uma decisão.</p><p>Escolha como Eduarda agirá. Cada decisão escreve a próxima parte. Voltar a uma página permite alterar o caminho; o futuro anterior será substituído. Não há pontuação moral.</p><button class="primary" onclick="turn(\'start\')">Capítulo I →</button>',1)+`<nav><button onclick="previous()">Fechar o livro</button></nav>`;return}if(state.id==='backcover'){app.innerHTML=`<section class="cover"><small>Contracapa</small><div class="coin">1</div><h1 style="font-size:42px">O fim de uma possibilidade.</h1><p>Uma escolha não contém todas as suas consequências. Uma vida não contém todos os caminhos que poderia ter seguido.</p><button class="primary" onclick="previous()">Reabrir o epílogo</button><button class="primary" onclick="reset()">Escrever outra versão</button></section>`;return}if(state.id==='end'){let late=state.log.some(x=>x.title==='Do lado de fora');let text=[late?'O atraso fez Eduarda perder a primeira atividade e passar pela recepção.':'Eduarda chegou a tempo e ouviu o anúncio da mostra na sala.',f.coin?'A moeda: '+f.coin+'.':'A moeda não foi levada.',f.submitted?`O conto “${f.title}” foi inscrito no formato ${f.format}${f.author==='Clara'?', em coautoria com Clara':''}.`:'O conto permaneceu no caderno; Eduarda contribuiu nos bastidores.',f.fulfilled?'Ela cumpriu o compromisso assumido.':f.adapted?'Ela pediu uma adaptação para participar.':'Ela optou por acompanhar a mostra.',({amizade:'Miguel e Eduarda combinaram trocar textos como amigos.',aproximação:'Eduarda expressou interesse em conhecer Miguel melhor. O futuro permanece aberto.',grupo:'Eduarda convidou Clara para os encontros literários.',individual:'Eduarda decidiu continuar escrevendo por conta própria.'})[f.relation]].filter(Boolean);app.innerHTML=page(`<small>Epílogo · sábado</small><h1>O que ficou.</h1>${text.map(t=>`<p>${esc(t)}</p>`).join('')}<h2>O contrafactual</h2><p>Uma decisão diferente poderia mudar o percurso, mas não podemos saber com certeza como. A chuva de quinta-feira não foi causada pela moeda.</p>`,`<small>Últimas anotações</small><h2>Seu percurso</h2><details><summary>Rever as decisões (${state.log.length})</summary>${logHTML()}</details><h2>O que dependeu de você?</h2><textarea class="note" oninput="note(this.value)">${esc(state.notes.end)}</textarea><p><button class="primary" onclick="turn('backcover')">Fechar o livro →</button></p>`,n)+nav;return}let x=nodes[state.id];app.innerHTML=page(`<small>Capítulo ${String(x.day).padStart(2,'0')} · ${days[x.day-1]} · ${x.time}</small><h1>${esc(x.title)}</h1><div class="photo"><img alt="Ilustração atmosférica" src="https://images.unsplash.com/${photos[x.place]}?auto=format&fit=crop&w=900&q=80" onerror="this.style.display='none'"></div><p>${esc(x.body)}</p>${context(state.id)?`<p><i>${esc(context(state.id))}</i></p>`:''}<div class="ornament">❦</div>`,`<small>O que Eduarda decide?</small><h2>A próxima página depende de você.</h2>${options(state.id).map((c,i)=>`<button class="choice" onclick="pick(${i})"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(c.label)}</span></button>`).join('')}<hr class="rule"><small>Margem do livro</small><textarea class="note" placeholder="Uma hipótese, uma reflexão..." oninput="note(this.value)">${esc(state.notes[state.id])}</textarea><details><summary>Marcador · ${state.log.length} decisões</summary>${logHTML()}</details>`,n)+nav}let sx=0,sy=0;app.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});app.addEventListener('touchend',e=>{if(e.target.closest('button,textarea,summary'))return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>100&&Math.abs(dy)<55){if(dx>0)previous();else if(state.id==='cover')turn('prelude');else if(state.id==='prelude')turn('start');else future()}},{passive:true});render();</script></body></html>
