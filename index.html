<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entre Universos</title><style>
*{box-sizing:border-box}body{margin:0;color:#e9f4ff;background:radial-gradient(ellipse at 85% 0,#285c83,transparent 55%),linear-gradient(145deg,#071324,#102d4b 65%,#173f60);min-height:100vh;font:16px system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:40px 24px}header{padding-top:70px;padding-bottom:24px}h1{font:clamp(48px,8vw,94px) Georgia;margin:12px 0;letter-spacing:-.05em}h2{font:32px Georgia;margin:12px 0}p{line-height:1.7;color:#b9d3e8}small{color:#9ebed8}nav{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}button,input,textarea,select{font:inherit;border:1px solid #7299b65c;border-radius:12px;padding:13px;color:inherit;background:#0c233b}button{cursor:pointer;background:#234c70}button:hover,button.active{background:#3b7199}input,textarea,select{width:100%;margin:7px 0}textarea{min-height:115px;resize:vertical}form{display:grid;gap:8px}section,article{border:1px solid #91c8ed29;background:#0a20366b;border-radius:22px;padding:clamp(18px,4vw,36px);margin:20px 0}article{background:#173b5660}article img{max-width:100%;max-height:650px;object-fit:contain;border-radius:12px;display:block;margin:18px auto}a{color:#a8ddff;overflow-wrap:anywhere}article p{white-space:pre-wrap;overflow-wrap:anywhere}label{color:#b9d3e8}#status{white-space:pre-wrap;color:#f5d8b0} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between} [hidden]{display:none!important} .stars{letter-spacing:12px;color:#a6d8ff}footer{padding:30px;text-align:center;color:#9ebed8}@media(max-width:600px){header,main{padding:25px 16px}nav button{flex:1 1 40%}} </style><header><div class="stars">✦ · ✧ · ✦</div><h1>Entre Universos.</h1><p>Um lugar para guardar o que acontece entre um instante e outro.</p><div id="status" role="status"></div></header><main><section id="setup"><p>Conectando ao Firebase…</p></section><section id="login" hidden><h2>Entrar no universo</h2><form id="loginForm"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button></form></section><div id="app" hidden><div class="row"><small id="who"></small><button id="logout">Sair</button></div><nav id="nav"></nav><section><h2 id="heading"></h2><p id="intro"></p><form id="post"><input id="title" maxlength="120" placeholder="Título (opcional)"><textarea id="body" maxlength="12000" placeholder="O que você quer guardar?"></textarea><div id="media"><label>Fotografia (opcional)</label><input id="photo" type="file" accept="image/*"></div><div id="linkbox"><label>Link de música ou vídeo</label><input id="url" type="url" placeholder="https://..."></div><button id="send">Guardar e compartilhar</button></form></section><div class="row"><h2>Nosso arquivo</h2><small id="count"></small></div><div id="feed"></div></div></main><footer>✦ Pequenos instantes também são universos. ✦</footer><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp,deleteDoc,doc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;const sections={moments:['Fragmentos de momentos','Fotos, vídeos por link e o que sentimos.'],thoughts:['Pensamentos repentinos','Sem roteiro, sem necessidade de fazer sentido.'],words:['Entre palavras','Poemas, frases e reflexões.'],music:['Nossa frequência','Músicas que merecem ser ouvidas.'],questions:['Perguntas entre universos','Pergunte e deixe espaço para a resposta.'],archive:['Cápsula de lembranças','Guarde algo para revisitar no futuro.']};let auth,db,user,stop,items=[],tab='moments';
function init(c){if(auth)return;const a=initializeApp(c);auth=getAuth(a);db=getFirestore(a);$('setup').hidden=true;onAuthStateChanged(auth,u=>{user=u;if(stop)stop();items=[];$('login').hidden=!!u;$('app').hidden=!u;if(!u)return;$('who').textContent=u.uid==='Fnu8LjQtSXPO19JUq7zBFmERzNA2'?'Paulo':u.uid==='MOHq8lu4dEhRrTvU2e8UFcxFMEm1'?'Eduarda':u.email;stop=onSnapshot(query(collection(db,'entries'),orderBy('created','desc')),snap=>{items=snap.docs.map(d=>({id:d.id,...d.data()}));render();status('Sincronizado • '+new Date().toLocaleTimeString('pt-BR'))},e=>status(e.message));});}
const firebaseConfig = {"apiKey": "AIzaSyCjQ1dAI844Qs4wHRcZwbsMU1qo0gWmtes", "authDomain": "edua-e492b.firebaseapp.com", "projectId": "edua-e492b", "storageBucket": "edua-e492b.firebasestorage.app", "messagingSenderId": "255446978029", "appId": "1:255446978029:web:9ed47c570b037f9a34ebe4", "measurementId": "G-SY05EDBG31"};
try { init(firebaseConfig); } catch(e) { status(e.message); }
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch(e){status(e.message)}};$('logout').onclick=()=>signOut(auth);
function el(tag,text,parent){const n=document.createElement(tag);if(text)n.textContent=text;if(parent)parent.append(n);return n}for(const [k,v] of Object.entries(sections)){let b=el('button',v[0],$('nav'));b.onclick=()=>{tab=k;switchTab()};b.dataset.tab=k}function switchTab(){$('heading').textContent=sections[tab][0];$('intro').textContent=sections[tab][1];$('media').hidden=!['moments','archive'].includes(tab);$('linkbox').hidden=!['moments','music','archive'].includes(tab);for(const b of $('nav').children)b.classList.toggle('active',b.dataset.tab===tab);render()}switchTab();
async function compress(f){const im=await createImageBitmap(f);let scale=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);im.close();for(let q=.85;q>=.25;q-=.1){let s=c.toDataURL('image/jpeg',q);if(s.length<650000)return s}throw Error('Foto muito grande; escolha outra.');}
function safeLink(s){if(!s)return '';const u=new URL(s);if(!['https:','http:'].includes(u.protocol))throw Error('Use um link HTTP ou HTTPS');return u.href}
$('post').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{const body=$('body').value.trim(),title=$('title').value.trim(),url=$('linkbox').hidden?'':safeLink($('url').value.trim()),photo=$('media').hidden||!$('photo').files[0]?'':await compress($('photo').files[0]);if(!body&&!title&&!url&&!photo)throw Error('Escreva algo ou adicione uma lembrança.');await addDoc(collection(db,'entries'),{kind:tab,title,body,url,photo,author:user.uid,created:serverTimestamp(),parent:''});$('post').reset();status('Compartilhado!')}catch(e){status(e.message)}finally{$('send').disabled=false}};
function render(){const feed=$('feed');feed.replaceChildren();const list=items.filter(x=>x.kind===tab&&!x.parent);$('count').textContent=list.length+' registros';if(!list.length)el('p','Ainda não há lembranças nesta seção.',feed);for(const x of list){const a=el('article','',feed);el('small',(x.author===user?.uid?'Você':'Outra pessoa')+' · '+(x.created?.toDate().toLocaleString('pt-BR')||'Enviando…'),a);if(x.title)el('h2',x.title,a);if(x.body)el('p',x.body,a);if(x.photo?.startsWith('data:image/jpeg;base64,')){let im=el('img','',a);im.src=x.photo;im.alt='Fotografia compartilhada';im.loading='lazy'}if(x.url){try{let l=el('a','Abrir música ou vídeo ↗',a);l.href=safeLink(x.url);l.target='_blank';l.rel='noopener noreferrer'}catch{}}if(x.kind==='questions'){for(const r of items.filter(r=>r.parent===x.id)){el('small',r.author===user?.uid?'Sua resposta':'Resposta da outra pessoa',a);el('p',r.body,a);if(r.author===user?.uid){let b=el('button','Excluir resposta',a);b.onclick=()=>remove(r.id)}}if(x.author!==user?.uid){const f=el('form','',a),t=el('textarea','',f);t.placeholder='Sua resposta';t.required=true;t.maxLength=12000;el('button','Responder',f);f.onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,'entries'),{kind:'questions',title:'',body:t.value.trim(),url:'',photo:'',author:user.uid,created:serverTimestamp(),parent:x.id});t.value=''}catch(e){status(e.message)}}}}if(x.author===user?.uid){let b=el('button','Excluir publicação',a);b.onclick=()=>remove(x.id)}}}async function remove(id){if(confirm('Excluir este registro?'))try{await deleteDoc(doc(db,'entries',id))}catch(e){status(e.message)}}
</script></html>
