import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import {getFirestore,collection,addDoc,onSnapshot,query,orderBy,serverTimestamp,deleteDoc,doc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;const sections={moments:['Fragmentos de momentos','Fotos, vídeos por link e o que sentimos.'],thoughts:['Pensamentos repentinos','Sem roteiro, sem necessidade de fazer sentido.'],words:['Entre palavras','Poemas, frases e reflexões.'],music:['Nossa frequência','Músicas que merecem ser ouvidas.'],questions:['Perguntas entre universos','Pergunte e deixe espaço para a resposta.'],archive:['Cápsula de lembranças','Guarde algo para revisitar no futuro.']};let auth,db,user,stop,items=[],tab='home',kind='moments',seen=new Set();
function init(c){if(auth)return;const a=initializeApp(c);auth=getAuth(a);db=getFirestore(a);$('setup').hidden=true;onAuthStateChanged(auth,u=>{user=u;closeMenu();if(stop)stop();items=[];seen=new Set();tab='home';$('feed').replaceChildren();$('composer').hidden=true;$('workspace').classList.remove('composing');$('compose').setAttribute('aria-expanded','false');$('login').hidden=!!u;$('app').hidden=!u;if(!u)return;try{seen=new Set(JSON.parse(localStorage.getItem('eu-seen-'+u.uid)||'[]'))}catch{};$('who').textContent=u.uid==='Fnu8LjQtSXPO19JUq7zBFmERzNA2'?'Paulo':u.uid==='MOHq8lu4dEhRrTvU2e8UFcxFMEm1'?'Eduarda':u.email;stop=onSnapshot(query(collection(db,'entries'),orderBy('created','desc')),snap=>{items=snap.docs.map(d=>({id:d.id,...d.data()}));render();status('Sincronizado • '+new Date().toLocaleTimeString('pt-BR'))},e=>status(e.message));});}

$('loginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch(e){status(e.message)}};$('logout').onclick=()=>signOut(auth);
function el(tag,text,parent){const n=document.createElement(tag);if(text)n.textContent=text;if(parent)parent.append(n);return n}const icons={moments:'◈',thoughts:'✧',words:'❦',music:'♫',questions:'?',archive:'⌛'};

function closeMenu(){$('nav').hidden=true;$('menu').setAttribute('aria-expanded','false');$('menu').setAttribute('aria-label','Abrir categorias')}
$('menu').onclick=()=>{const open=$('nav').hidden;$('nav').hidden=!open;$('menu').setAttribute('aria-expanded',String(open));$('menu').setAttribute('aria-label',open?'Fechar categorias':'Abrir categorias')};document.addEventListener('click',e=>{if(!e.target.closest('.menuwrap'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('nav').hidden){closeMenu();$('menu').focus()}});$('home').onclick=()=>{tab='home';closeMenu();render()};

$('kind').onchange=()=>{kind=$('kind').value;updateComposer()};function updateComposer(){$('heading').textContent=sections[kind][0];$('intro').textContent=sections[kind][1];$('media').hidden=!['moments','archive'].includes(kind);$('linkbox').hidden=!['moments','music','archive'].includes(kind)}updateComposer();
function isNew(x){return x.author!==user?.uid&&!seen.has(x.id)}function related(x){return items.filter(r=>r.parent===x.id)}function fresh(x){return isNew(x)||related(x).some(isNew)}function mark(x){for(const r of [x,...related(x)])if(r.author!==user.uid)seen.add(r.id);try{localStorage.setItem('eu-seen-'+user.uid,JSON.stringify([...seen]))}catch{status('Não foi possível salvar a leitura neste navegador.')}render()}
async function compress(f){const im=await createImageBitmap(f);let scale=Math.min(1,1000/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);im.close();for(let q=.85;q>=.25;q-=.1){let s=c.toDataURL('image/jpeg',q);if(s.length<650000)return s}throw Error('Foto muito grande; escolha outra.');}
function safeLink(s){if(!s)return '';const u=new URL(s);if(!['https:','http:'].includes(u.protocol))throw Error('Use um link HTTP ou HTTPS');return u.href}
$('post').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{const body=$('body').value.trim(),title=$('title').value.trim(),url=$('linkbox').hidden?'':safeLink($('url').value.trim()),photo=$('media').hidden||!$('photo').files[0]?'':await compress($('photo').files[0]);if(!body&&!title&&!url&&!photo)throw Error('Escreva algo ou adicione uma lembrança.');await addDoc(collection(db,'entries'),{kind:kind,title,body,url,photo,author:user.uid,created:serverTimestamp(),parent:''});$('post').reset();$('kind').value=kind;status('Compartilhado!')}catch(e){status(e.message)}finally{$('send').disabled=false}};
function render(){const feed=$('feed');feed.replaceChildren();const roots=items.filter(x=>!x.parent);const list=roots.filter(x=>tab==='home'?fresh(x):x.kind===tab);$('total').textContent='('+roots.filter(fresh).length+')';$('feedtitle').textContent=tab==='home'?'O que chegou por aqui':sections[tab][0];$('feedintro').textContent=tab==='home'?'Pequenos fragmentos que você ainda não marcou como vistos.':sections[tab][1];for(const b of $('nav').children){const k=b.dataset.tab,n=roots.filter(x=>x.kind===k&&fresh(x)).length;b.firstChild.textContent=icons[k]+' '+sections[k][0]+(n?' · '+n+' novas':'');b.classList.toggle('active',tab===k)}$('home').classList.toggle('active',tab==='home');$('count').textContent=list.length+' registros';if(!list.length){const empty=el('div','',feed);empty.className='empty';el('span','✧',empty);el('p',tab==='home'?'Tudo em dia, por enquanto.':'Toda história começa com uma página em branco.',empty);el('small',tab==='home'?'As próximas novidades aparecerão aqui. As lembranças continuam nas categorias.':'Que tal guardar o primeiro fragmento aqui?',empty);}for(const x of list){const a=el('article','',feed);if(fresh(x)){a.classList.add('unread');const flag=el('div','',a);flag.className='newflag';el('span',isNew(x)?'✦ Nova publicação':'✦ Nova resposta',flag);const read=el('button','Marcar como visto',flag);read.onclick=()=>mark(x)}const tag=el('div',icons[x.kind]+' '+sections[x.kind][0],a);tag.className='categorytag';el('small',(x.author===user?.uid?'Você':(x.author==='Fnu8LjQtSXPO19JUq7zBFmERzNA2'?'Paulo':'Eduarda'))+' · '+(x.created?.toDate().toLocaleString('pt-BR')||'Enviando…'),a);if(x.title)el('h2',x.title,a);if(x.body)el('p',x.body,a);if(x.photo?.startsWith('data:image/jpeg;base64,')){let im=el('img','',a);im.src=x.photo;im.alt='Fotografia compartilhada';im.loading='lazy'}if(x.url){try{let l=el('a','Abrir música ou vídeo ↗',a);l.href=safeLink(x.url);l.target='_blank';l.rel='noopener noreferrer'}catch{}}if(x.kind==='questions'){for(const r of related(x)){const reply=el('div','',a);reply.className='reply';el('small',(r.author===user?.uid?'Sua resposta':'Resposta da outra pessoa')+(isNew(r)?' · Nova':''),reply);el('p',r.body,reply);if(r.author===user?.uid){let b=el('button','Excluir resposta',reply);b.onclick=()=>remove(r.id)}}if(x.author!==user?.uid){const f=el('form','',a),t=el('textarea','',f);t.placeholder='Sua resposta';t.required=true;t.maxLength=12000;el('button','Responder',f);f.onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,'entries'),{kind:'questions',title:'',body:t.value.trim(),url:'',photo:'',author:user.uid,created:serverTimestamp(),parent:x.id});t.value=''}catch(e){status(e.message)}}}}if(x.author===user?.uid){let b=el('button','Excluir publicação',a);b.onclick=()=>remove(x.id)}}}async function remove(id){if(confirm('Excluir este registro?'))try{await deleteDoc(doc(db,'entries',id))}catch(e){status(e.message)}}
