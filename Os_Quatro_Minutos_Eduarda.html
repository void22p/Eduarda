@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;600&display=swap');*{box-sizing:border-box}body{margin:0;background:#20160f;color:#f0dfc5;font:18px Georgia,serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #d9b477;outline-offset:3px}header{position:sticky;top:0;z-index:5;background:#20160ff5;border-bottom:1px solid #76573d;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;gap:10px}small,.tag{font:600 11px 'DM Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;color:#bda17e}header button,.minor{background:none;border:1px solid #76573d;padding:9px 13px;border-radius:3px;font-size:14px}main{max-width:1250px;margin:auto;padding:28px 5vw 60px}.cover{min-height:76vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px}.cover h1{font-size:clamp(65px,10vw,145px);line-height:.78;margin:30px 0;font-family:'Cormorant Garamond',Georgia;font-weight:500;letter-spacing:-5px}.cover p{max-width:550px;line-height:1.7;color:#d3bda2}.coin{width:min(65vw,320px);aspect-ratio:1;border-radius:50%;margin:auto;display:grid;place-content:center;text-align:center;color:#4d3016;background:radial-gradient(circle at 35% 25%,#f4d39b,#b38449 48%,#694522 75%);border:12px double #d1ab70;box-shadow:0 0 0 14px #604124,0 30px 80px #0009,inset 0 0 35px #43260c;transform:rotate(-12deg);animation:float 6s ease-in-out infinite}.coin b{font-size:100px;line-height:1}.coin span{letter-spacing:8px;font-size:14px}@keyframes float{50%{transform:translateY(-12px) rotate(-5deg)}}.primary{background:#d3ad78;color:#29190e;border:0;padding:17px 25px;font-weight:bold}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}.hero{height:220px;position:relative;overflow:hidden;background:linear-gradient(130deg,#5d412c,#21160e);border:1px solid #8e6d4c}.hero img{width:100%;height:100%;object-fit:cover;filter:sepia(.75) brightness(.65)}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent,#20160fbb)}.hero .tag{position:absolute;bottom:20px;left:24px;z-index:1;color:#fff0d5}.paper{background:#ead9bd;color:#39281c;padding:clamp(22px,4vw,48px);box-shadow:0 14px 40px #0004;border:1px solid #b89b73}.paper h1{font:700 clamp(35px,5vw,62px)/1 'Cormorant Garamond',Georgia;margin:12px 0 22px}.paper p{line-height:1.75;margin:0 0 20px}.paper .tag{color:#785739}.choice{display:flex;width:100%;text-align:left;align-items:center;gap:16px;background:#f5e7d0;border:1px solid #bda17b;color:#39281c;padding:15px;margin:9px 0;transition:.2s}.choice:hover{background:#d9b98a;transform:translateX(4px)}.choice b{font:12px Arial;color:#87623c}.side{border:1px solid #76573d;padding:20px;align-self:start;background:#2a1c13}.side h2{font-size:23px;font-weight:normal}.side p{font-size:15px;line-height:1.5;color:#d0b89b}.days{display:flex;gap:5px;margin:16px 0}.days span{flex:1;height:4px;background:#59402c}.days .on{background:#d4ac73}.entry{border-left:1px solid #9c7952;padding:0 0 15px 12px;margin-left:4px;font-size:14px;line-height:1.5}.entry small{display:block;letter-spacing:1px}.note{width:100%;min-height:110px;background:#f5e7d0;border:1px solid #bda17b;color:#39281c;padding:12px}.fade{animation:appear .5s ease-out}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.ending{max-width:800px;margin:auto}.ending h1{font-size:55px}.ending .entry{border-color:#98724b}.ending .entry small{color:#785739}.ending .minor{color:#39281c}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:800px){.cover,.layout{grid-template-columns:1fr}.coin{width:180px;grid-row:1}.coin b{font-size:60px}.cover h1{letter-spacing:-2px}.hero{height:150px}header{flex-wrap:wrap}.side{order:2}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><small>O peso do possível / edição Eduarda</small><div><button onclick="back()">↶ Voltar uma escolha</button> <button onclick="reset()">Recomeçar</button></div></header><main id="app"></main><script>
const nodes={"start": {"day": 1, "time": "06:56", "place": "rua", "title": "A moeda", "body": "A quatro minutos do fechamento do portão, Eduarda vê uma moeda de um real perto da banca de jornais. Uma senhora de bolsa verde examina o chão. A escola fica a três minutos dali. Na mochila, um conto ainda incompleto para a mostra literária de sexta-feira. O celular vibra: Clara pergunta se ela já chegou.", "choices": [{"label": "Perguntar à senhora se perdeu a moeda", "to": "woman", "set": {"coin": "devolvida"}}, {"label": "Pegar a moeda e continuar", "to": "pick", "set": {"coin": "guardada"}}, {"label": "Não parar; responder Clara depois", "to": "gate", "set": {"coin": "ignorada"}}, {"label": "Fotografar a moeda para usar no conto", "to": "photo", "set": {"coin": "fotografada"}}]}, "woman": {"day": 1, "time": "06:58", "place": "rua", "title": "Dona Lúcia", "body": "A moeda era de Lúcia, que precisava completar a passagem. Ela agradece e pergunta o nome da estudante. Ao ouvir Eduarda, comenta que trabalha na biblioteca municipal e que hoje haverá uma caixa de livros doados. O ônibus chega. Restam dois minutos.", "choices": [{"label": "Despedir-se e seguir para a escola", "to": "late", "set": {"lucia": true}}, {"label": "Anotar o horário da biblioteca antes de sair", "to": "late", "set": {"lucia": true, "invite": true}}]}, "pick": {"day": 1, "time": "06:57", "place": "rua", "title": "Um real no bolso", "body": "Ao guardar a moeda, Eduarda percebe que o cadarço se soltou. Parar para amarrá-lo custa mais alguns segundos. A senhora ainda procura algo. Ela pode voltar ou seguir.", "choices": [{"label": "Voltar e perguntar sobre a moeda", "to": "woman", "set": {"coin": "devolvida"}}, {"label": "Amarrar o cadarço e seguir", "to": "edge", "set": {}}, {"label": "Deixar a moeda sobre a banca para quem perdeu", "to": "edge", "set": {"coin": "deixada"}}]}, "photo": {"day": 1, "time": "06:58", "place": "rua", "title": "Uma imagem", "body": "A fotografia captura também a senhora ao fundo. Eduarda pensa em uma abertura para seu conto: um objeto banal que muda uma manhã. O sinal da escola soa ao longe.", "choices": [{"label": "Guardar o celular e seguir", "to": "late", "set": {}}, {"label": "Apagar a foto por respeito à privacidade e seguir", "to": "late", "set": {"coin": "ignorada"}}]}, "edge": {"day": 1, "time": "07:00", "place": "escola", "title": "O último segundo", "body": "O inspetor Sérgio está fechando o portão. Clara acena do pátio. Ele ainda consegue ouvir Eduarda.", "choices": [{"label": "Pedir que espere e mostrar a carteirinha", "to": "gate", "set": {}}, {"label": "Aceitar o fechamento sem discutir", "to": "late", "set": {}}]}, "gate": {"day": 1, "time": "07:00", "place": "escola", "title": "Dentro do portão", "body": "Eduarda chega a tempo. Clara guardou um lugar na sala. A professora Helena anuncia que a mostra de sexta terá leitura pública e inscrições até quarta. Miguel, 16 anos, aluno de outra turma, está ajudando a organizar os textos.", "choices": [{"label": "Inscrever-se para ler o próprio conto", "to": "class", "set": {"read": true}}, {"label": "Oferecer ajuda na organização", "to": "class", "set": {"organize": true}}, {"label": "Preferir assistir à mostra", "to": "class", "set": {}}]}, "late": {"day": 1, "time": "07:02", "place": "escola", "title": "Do lado de fora", "body": "Sérgio explica que a entrada atrasada só será autorizada às 07:20 pela coordenação. A primeira atividade já começou. Eduarda tem vinte minutos e precisa avisar a escola e sua responsável.", "choices": [{"label": "Explicar o ocorrido com sinceridade", "to": "wait", "set": {"honest": true}}, {"label": "Apenas informar que chegou atrasada", "to": "wait", "set": {}}, {"label": "Pedir à coordenação autorização para recuperar a atividade", "to": "wait", "set": {"recover": true}}]}, "wait": {"day": 1, "time": "07:10", "place": "escola", "title": "O banco da entrada", "body": "Enquanto aguarda na recepção, Eduarda recebe uma mensagem de Clara: a turma precisa escolher uma dupla para a mostra. Miguel também está na recepção, entregando cartazes à secretaria. Ele deixa cair uma folha com um poema autoral.", "choices": [{"label": "Entregar a folha sem ler", "to": "miguel", "set": {"miguel": true}}, {"label": "Avisar que a folha caiu e continuar esperando", "to": "class", "set": {"miguel": true}}, {"label": "Responder Clara e perguntar sobre a dupla", "to": "class", "set": {"clara": true}}]}, "miguel": {"day": 1, "time": "07:15", "place": "escola", "title": "O poema dobrado", "body": "Miguel agradece. Diz que escreve, mas não sabe se quer ler em público. Eduarda reconhece no título uma referência à ideia de acaso. A coordenadora chama seu nome.", "choices": [{"label": "Sugerir conversar sobre literatura no intervalo", "to": "class", "set": {"talk": true}}, {"label": "Desejar boa sorte e entrar na sala", "to": "class", "set": {}}]}, "class": {"day": 1, "time": "09:40", "place": "escola", "title": "O intervalo", "body": "A atividade da manhã era uma interpretação de conto. Clara está preocupada com a nota e quer revisar as respostas. Na mesa ao lado, Miguel organiza os cartazes da mostra. O intervalo dura quinze minutos.", "choices": [{"label": "Revisar a atividade com Clara", "to": "lunch", "set": {"clara": true}}, {"label": "Conversar com Miguel sobre o tema da mostra", "to": "lunch", "set": {"miguel": true, "talk": true}}, {"label": "Dividir o intervalo entre os dois", "to": "lunch", "set": {"clara": true, "miguel": true}}, {"label": "Escrever sozinha no caderno", "to": "lunch", "set": {"draft": true}}]}, "lunch": {"day": 1, "time": "12:10", "place": "escola", "title": "Depois da aula", "body": "A professora Helena lembra que o conto precisa ter até três páginas. Clara sugere estudar juntas amanhã. O cartaz da biblioteca municipal anuncia uma roda de leitura às 15h. Eduarda precisa combinar a tarde com sua responsável.", "choices": [{"label": "Ir à biblioteca com autorização", "to": "library", "set": {"library": true}}, {"label": "Voltar para casa e trabalhar no conto", "to": "home", "set": {"draft": true}}, {"label": "Combinar estudo com Clara e voltar para casa", "to": "home", "set": {"clara": true, "study": true}}]}, "library": {"day": 1, "time": "15:00", "place": "biblioteca", "title": "A caixa de doações", "body": "Lúcia organiza livros usados. Entre eles há um caderno sem nome, com uma frase manuscrita: “O que muda quando chegamos quatro minutos depois?” A bibliotecária explica que o caderno foi encontrado entre doações e pode ter dono.", "choices": [{"label": "Deixar o caderno com Lúcia para localizar o dono", "to": "reading", "set": {"notebook": "deixado"}}, {"label": "Pedir autorização para copiar apenas a frase", "to": "reading", "set": {"notebook": "frase", "draft": true}}, {"label": "Ajudar Lúcia a organizar os livros", "to": "reading", "set": {"notebook": "deixado", "help": true}}]}, "reading": {"day": 1, "time": "15:35", "place": "biblioteca", "title": "A roda de leitura", "body": "Miguel aparece com um livro emprestado. O grupo discute se uma boa intenção garante uma boa consequência. Lúcia convida os jovens a apresentar textos na sexta, junto à escola.", "choices": [{"label": "Compartilhar a ideia da moeda, sem inventar o que não sabe", "to": "home", "set": {"miguel": true, "talk": true, "draft": true}}, {"label": "Ouvir e anotar argumentos para o conto", "to": "home", "set": {"draft": true}}, {"label": "Conversar com Lúcia sobre a parceria com a escola", "to": "home", "set": {"help": true, "organize": true}}]}, "home": {"day": 1, "time": "19:30", "place": "casa", "title": "A primeira página", "body": "À noite, Eduarda abre o caderno. A manhã parece pequena demais para uma história, mas cada detalhe permite imaginar um caminho diferente. Clara envia uma mensagem perguntando se está tudo bem. O prazo da mostra se aproxima.", "choices": [{"label": "Escrever sobre a moeda e suas consequências", "to": "tue", "set": {"theme": "acaso", "draft": true}}, {"label": "Escrever sobre uma amizade que muda por um atraso", "to": "tue", "set": {"theme": "amizade", "draft": true}}, {"label": "Escrever sobre dois jovens que se conhecem por acaso", "to": "tue", "set": {"theme": "encontro", "draft": true}}, {"label": "Responder Clara e descansar antes de escrever", "to": "tue", "set": {"theme": "cotidiano", "clara": true}}]}, "tue": {"day": 2, "time": "07:05", "place": "escola", "title": "O trabalho em dupla", "body": "Helena pede uma análise em dupla. Clara esperava trabalhar com Eduarda, mas Miguel está sem parceiro porque seu colega faltou. Há uma terceira opção: solicitar um trio, embora a professora possa precisar reorganizar a atividade.", "choices": [{"label": "Fazer dupla com Clara", "to": "pair", "set": {"partner": "Clara", "clara": true}}, {"label": "Convidar Miguel, explicando a Clara antes", "to": "pair", "set": {"partner": "Miguel", "miguel": true}}, {"label": "Pedir autorização para formar trio", "to": "pair", "set": {"partner": "trio", "clara": true, "miguel": true}}]}, "pair": {"day": 2, "time": "10:15", "place": "escola", "title": "A margem do texto", "body": "A análise termina. Helena sugere que Eduarda leve uma versão do conto amanhã. Clara comenta que também quer escrever, mas tem receio de mostrar seu texto. Miguel oferece uma opinião se Eduarda quiser.", "choices": [{"label": "Trocar textos com Clara", "to": "feedback", "set": {"review": "Clara", "clara": true}}, {"label": "Pedir opinião a Miguel", "to": "feedback", "set": {"review": "Miguel", "miguel": true}}, {"label": "Revisar sozinha antes de mostrar a alguém", "to": "feedback", "set": {"review": "própria"}}]}, "feedback": {"day": 2, "time": "16:20", "place": "casa", "title": "Uma crítica útil", "body": "Ao reler o conto, Eduarda percebe que a personagem parece conhecer as consequências antes de decidir. Isso enfraquece a ideia: ninguém sabia o que aconteceria quando viu a moeda.", "choices": [{"label": "Reescrever a cena sem antecipar o futuro", "to": "wed", "set": {"revision": "incerteza"}}, {"label": "Manter a antecipação como recurso literário explícito", "to": "wed", "set": {"revision": "narrador"}}, {"label": "Criar dois pontos de vista sobre o mesmo instante", "to": "wed", "set": {"revision": "perspectivas"}}]}, "wed": {"day": 3, "time": "08:20", "place": "escola", "title": "O prazo", "body": "As inscrições terminam ao meio-dia. Helena oferece três formatos: leitura individual, exposição escrita ou colaboração com outro aluno, desde que os créditos sejam claros. Eduarda precisa decidir como apresentar seu trabalho.", "choices": [{"label": "Inscrever leitura individual", "to": "submit", "set": {"format": "leitura"}}, {"label": "Inscrever exposição escrita", "to": "submit", "set": {"format": "exposição"}}, {"label": "Propor colaboração e combinar créditos", "to": "collab", "set": {"format": "colaboração"}}, {"label": "Não inscrever o conto; ajudar na mostra", "to": "organize", "set": {"format": "bastidores"}}]}, "collab": {"day": 3, "time": "09:10", "place": "escola", "title": "Dois nomes", "body": "Uma colaboração precisa de consentimento e trabalho real de ambas as partes. Clara prefere escrever um segundo ponto de vista. Miguel prefere comentar a estrutura sem assinar como autor.", "choices": [{"label": "Convidar Clara para coautoria", "to": "submit", "set": {"author": "Clara", "clara": true}}, {"label": "Manter autoria individual e agradecer Miguel pela revisão", "to": "submit", "set": {"author": "individual", "format": "exposição", "miguel": true}}, {"label": "Manter autoria individual e escrever as duas perspectivas", "to": "submit", "set": {"author": "individual", "format": "leitura"}}]}, "submit": {"day": 3, "time": "11:45", "place": "escola", "title": "O envelope", "body": "O texto está pronto para entrega. Há uma frase inspirada na manhã da moeda. Eduarda precisa decidir se o título revelará a consequência ou preservará a surpresa.", "choices": [{"label": "Intitular “Os quatro minutos”", "to": "thu", "set": {"title": "Os quatro minutos", "submitted": true}}, {"label": "Intitular “Um real”", "to": "thu", "set": {"title": "Um real", "submitted": true}}, {"label": "Intitular “O que não aconteceu”", "to": "thu", "set": {"title": "O que não aconteceu", "submitted": true}}]}, "organize": {"day": 3, "time": "11:45", "place": "escola", "title": "Outra contribuição", "body": "Helena aceita a ajuda. Eduarda pode preparar os cartões de apresentação ou organizar a ordem das leituras. O conto continua em seu caderno, mesmo sem inscrição.", "choices": [{"label": "Preparar cartões para os autores", "to": "thu", "set": {"role": "cartões"}}, {"label": "Organizar a ordem das leituras", "to": "thu", "set": {"role": "ordem"}}]}, "thu": {"day": 4, "time": "12:15", "place": "escola", "title": "Uma mudança de planos", "body": "A chuva prevista para sexta obriga a escola a transferir a mostra do pátio para a biblioteca. Há menos espaço. Helena pede ajuda para reorganizar as cadeiras. Clara quer conversar sobre seu texto; Miguel pergunta se Eduarda gostaria de trocar recomendações de livros depois da mostra.", "choices": [{"label": "Ajudar Helena e combinar outro horário com Clara", "to": "rain", "set": {"help": true, "clara": true}}, {"label": "Conversar com Clara primeiro e depois ajudar", "to": "rain", "set": {"clara": true, "help": true}}, {"label": "Aceitar a troca de recomendações e ajudar na mudança", "to": "rain", "set": {"miguel": true, "books": true, "help": true}}, {"label": "Avisar que precisa voltar para casa", "to": "rain", "set": {}}]}, "rain": {"day": 4, "time": "18:00", "place": "casa", "title": "A mensagem", "body": "A mostra começa amanhã às 14h. O celular recebe uma mensagem de Miguel perguntando se pode reservar um livro para Eduarda na biblioteca. Não há obrigação de aceitar, e o gesto pode significar apenas amizade.", "choices": [{"label": "Aceitar e sugerir conversar sobre o livro na mostra", "to": "fri", "set": {"books": true, "miguel": true}}, {"label": "Agradecer e dizer que prefere escolher pessoalmente", "to": "fri", "set": {"books": false}}, {"label": "Responder que prefere manter a conversa sobre a escola", "to": "fri", "set": {"boundary": true}}]}, "fri": {"day": 5, "time": "13:50", "place": "biblioteca", "title": "Dez minutos antes", "body": "A biblioteca está cheia. Helena confere a programação. Clara segura seu texto com as mãos inquietas. Miguel organiza os livros na mesa. Lúcia chega com uma caixa de doações. A mostra está prestes a começar.", "choices": [{"label": "Perguntar se Clara quer companhia antes de apresentar", "to": "show", "set": {"support": true, "clara": true}}, {"label": "Conferir a programação com Helena", "to": "show", "set": {"help": true}}, {"label": "Ajudar Lúcia com a caixa", "to": "show", "set": {"help": true, "lucia": true}}, {"label": "Sentar e observar o ambiente", "to": "show", "set": {}}]}, "show": {"day": 5, "time": "14:20", "place": "biblioteca", "title": "O momento público", "body": "Uma leitura termina e a sala aplaude. Helena se aproxima de Eduarda. O formato escolhido na quarta define o que acontece agora.", "choices": [{"label": "Participar conforme o compromisso assumido", "to": "after", "set": {"fulfilled": true}}, {"label": "Pedir uma adaptação do formato por nervosismo", "to": "after", "set": {"adapted": true}}, {"label": "Explicar que prefere não se apresentar e acompanhar os colegas", "to": "after", "set": {"withdraw": true}}]}, "after": {"day": 5, "time": "15:10", "place": "biblioteca", "title": "Depois dos aplausos", "body": "A mostra termina. Clara agradece a presença dos colegas. Miguel comenta que gostou da discussão sobre escolhas e pergunta se Eduarda quer continuar trocando textos. Lúcia anuncia que a biblioteca terá encontros mensais de leitura.", "choices": [{"label": "Combinar uma amizade literária com Miguel", "to": "sat", "set": {"relation": "amizade", "miguel": true}}, {"label": "Demonstrar interesse em conhecê-lo melhor, sem pressa", "to": "sat", "set": {"relation": "aproximação", "miguel": true}}, {"label": "Convidar Clara para os encontros mensais", "to": "sat", "set": {"relation": "grupo", "clara": true}}, {"label": "Preferir escrever por conta própria", "to": "sat", "set": {"relation": "individual"}}]}, "sat": {"day": 6, "time": "09:30", "place": "rua", "title": "A mesma calçada", "body": "No sábado, Eduarda passa novamente pela banca. O lugar parece idêntico. Nenhuma moeda brilha no chão. Ela tem tempo para observar o movimento da rua e pensar na semana.", "choices": [{"label": "Registrar no diário o que de fato aconteceu", "to": "end", "set": {"reflection": "fatos"}}, {"label": "Imaginar uma alternativa sem tratá-la como certeza", "to": "end", "set": {"reflection": "alternativas"}}, {"label": "Escrever uma carta para a Eduarda de segunda-feira", "to": "end", "set": {"reflection": "carta"}}]}};const photos={rua:'photo-1519608487953-e999c86e7455',escola:'photo-1509062522246-3755977927d7',biblioteca:'photo-1507842217343-583bb7270b66',casa:'photo-1455390582262-044cdead277a'};const days=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];const app=document.getElementById('app');let state={id:'cover',flags:{},log:[],notes:{}};let history=[];try{const saved=JSON.parse(localStorage.getItem('quatro-minutos-v3'));if(saved){state=saved.state;history=saved.history}}catch(e){};function save(){try{localStorage.setItem('quatro-minutos-v3',JSON.stringify({state,history}))}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(id,flags={},label=''){history.push(JSON.parse(JSON.stringify(state)));if(label){let x=nodes[state.id];state.log.push({day:x.day,time:x.time,title:x.title,label})}Object.assign(state.flags,flags);state.id=id;save();render();window.scrollTo(0,0)}function back(){if(history.length){state=history.pop();save();render();window.scrollTo(0,0)}}function reset(){if(confirm('Recomeçar a história? O percurso atual será apagado.')){state={id:'cover',flags:{},log:[],notes:{}};history=[];save();render()}}function note(v){state.notes[state.id]=v;save()}function context(id){let f=state.flags;let a=[];if(id==='class'&&state.log.some(x=>x.title==='Do lado de fora'))a.push(f.recover?'A coordenação combinou a recuperação da atividade.':'Eduarda perdeu a primeira atividade e precisará pedir o conteúdo.');if(id==='library'&&f.lucia)a.push('Lúcia reconhece Eduarda da manhã e agradece novamente.');if(id==='library'&&!f.lucia)a.push('Lúcia se apresenta; é a primeira conversa entre as duas.');if(id==='tue'&&f.study)a.push('Clara lembra do estudo combinado ontem e reserva um horário depois da aula.');if(id==='feedback')a.push(f.review==='própria'?'A observação surgiu durante a revisão individual.':f.review+' apontou essa questão durante a troca de textos.');if(id==='wed'&&f.draft)a.push('As anotações feitas nos dias anteriores facilitaram a preparação da versão final.');if(id==='show')a.push(f.format==='bastidores'?'Eduarda está na equipe de organização, não na lista de autores.':f.format==='exposição'?'O conto está exposto na mesa, sem obrigação de leitura oral.':f.author==='Clara'?'Clara está pronta para dividir a apresentação e os créditos.':'O nome de Eduarda aparece na programação de leitura.');if(id==='after'&&f.boundary)a.push('Miguel respeitou o limite estabelecido na mensagem e mantém a conversa sobre literatura.');if(id==='after'&&f.books)a.push('O livro reservado está na mesa; Miguel mostra onde encontrá-lo.');if(id==='after'&&f.support)a.push('Clara conta que a companhia antes da leitura a ajudou a se sentir mais tranquila.');return a.join(' ')}function options(id){let x=nodes[id].choices;if(id==='show'&&state.flags.format==='bastidores')return [{label:'Cumprir a tarefa de organização combinada',to:'after',set:{fulfilled:true}},{label:'Pedir ajuda à equipe e acompanhar a mostra',to:'after',set:{adapted:true}}];if(id==='after'&&state.flags.boundary)return x.filter(c=>c.set.relation!=='aproximação');return x}function choose(i){let c=options(state.id)[i];go(c.to,c.set,c.label)}function logHTML(){return state.log.map(x=>`<div class="entry"><small>${days[x.day-1]} · ${x.time}</small>${esc(x.title)}<br><b>${esc(x.label)}</b></div>`).join('')}function render(){let f=state.flags;if(state.id==='cover'){app.innerHTML=`<section class="cover fade"><div><small>Uma novela interativa em seis dias</small><h1>Os quatro<br><i>minutos.</i></h1><p>Eduarda, 16 anos, estudante do ensino médio, gosta de literatura e filosofia. É segunda-feira. Na sexta haverá uma mostra literária na escola. Ela tem um conto por terminar, uma amiga chamada Clara e uma manhã aparentemente comum. O portão fecha às 7h.</p><p>Uma moeda de um real está na calçada. O resto ainda não aconteceu.</p><button class="primary" onclick="go('start')">Abrir a primeira página →</button></div><div class="coin"><b>1</b><span>REAL</span><small style="color:#4d3016">2026</small></div></section>`;return}if(state.id==='end'){let late=state.log.some(x=>x.title==='Do lado de fora');let text=[late?'O atraso fez Eduarda perder a primeira atividade e passar pela recepção.':'Eduarda chegou a tempo e ouviu o anúncio da mostra na sala.',f.coin==='devolvida'?'A moeda voltou à dona, Lúcia.':f.coin==='guardada'?'A moeda permaneceu no bolso.':f.coin==='deixada'?'A moeda ficou na banca.':'A moeda não foi levada.',f.submitted?`O conto “${f.title}” foi inscrito no formato ${f.format}${f.author==='Clara'?', em coautoria com Clara':''}.`:'O conto permaneceu no caderno; Eduarda contribuiu nos bastidores.',f.fulfilled?'Ela cumpriu o compromisso assumido na mostra.':f.adapted?'Ela pediu uma adaptação para participar.':'Ela optou por acompanhar a mostra sem se apresentar.',({amizade:'Miguel e Eduarda combinaram trocar textos como amigos.',aproximação:'Eduarda expressou interesse em conhecer Miguel melhor. O futuro dessa aproximação permanece aberto.',grupo:'Eduarda convidou Clara para os encontros literários.',individual:'Eduarda decidiu continuar escrevendo por conta própria.'})[f.relation]].filter(Boolean);app.innerHTML=`<article class="paper ending fade"><small class="tag">Epílogo · sábado</small><h1>O que ficou.</h1>${text.map(t=>`<p>${esc(t)}</p>`).join('')}<h2>O contrafactual</h2><p>${late?'Se Eduarda não tivesse parado, talvez tivesse chegado antes. Isso não permite concluir que jamais conheceria Miguel ou Lúcia.':'Se Eduarda tivesse parado, talvez tivesse perdido a primeira atividade. Isso não permite concluir que a semana teria sido melhor ou pior.'} A chuva de quinta-feira não foi causada pela moeda. Nem tudo que acontece depois de uma decisão é consequência dela.</p><h2>Seu percurso</h2>${logHTML()}<h2>Última página do diário</h2><textarea class="note" oninput="note(this.value)" placeholder="O que dependeu de suas escolhas? O que não dependia?">${esc(state.notes.end)}</textarea><div class="actions"><button class="minor" onclick="back()">Revisitar última decisão</button><button class="minor" onclick="reset()">Experimentar outra semana</button></div></article>`;return}let x=nodes[state.id];app.innerHTML=`<div class="layout fade"><section><div class="hero"><img alt="Fotografia atmosférica ilustrativa" src="https://images.unsplash.com/${photos[x.place]}?auto=format&fit=crop&w=1200&q=80" onerror="this.style.display='none'"><span class="tag">${days[x.day-1]} / ${x.time} / ${x.place}</span></div><article class="paper"><small class="tag">Capítulo ${String(x.day).padStart(2,'0')} · decisão ${state.log.length+1}</small><h1>${esc(x.title)}</h1><p>${esc(x.body)}</p>${context(state.id)?`<p style="border-left:3px solid #a47a49;padding-left:15px;font-style:italic">${esc(context(state.id))}</p>`:''}<small class="tag">O que Eduarda decide?</small>${options(state.id).map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>0${i+1}</b><span>${esc(c.label)}</span></button>`).join('')}</article></section><aside class="side"><small>Diário de acontecimentos</small><div class="days">${days.map((d,i)=>`<span class="${i<x.day?'on':''}" title="${d}"></span>`).join('')}</div><h2>${days[x.day-1]}, ${x.time}</h2><p>Eduarda · 16 anos<br>Mostra literária: sexta-feira</p><p>${f.coin?'Moeda: '+esc(f.coin):'Nenhuma decisão registrada.'}${f.format?'<br>Formato: '+esc(f.format):''}</p><details ${state.log.length<4?'open':''}><summary>Decisões anteriores (${state.log.length})</summary><div style="margin-top:15px">${logHTML()}</div></details><h2>Margem do caderno</h2><textarea class="note" oninput="note(this.value)" placeholder="Anote uma hipótese ou pensamento...">${esc(state.notes[state.id])}</textarea><p>O progresso é salvo neste navegador. Voltar restaura as consequências anteriores.</p></aside></div>`}render();</script></body></html>
